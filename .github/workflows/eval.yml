# The scored evaluation. It calls live models, so every run costs money — which is
# why it is not triggered by pushes to main (the free checks live in ci.yml).
#
# The gap this is shaped around, stated rather than left implicit: a 12-item smoke
# run CANNOT gate on completion or grounding. SE at n=12 is 11.55pp, so a 2pp
# threshold there would be pure noise. The smoke therefore gates only on what has
# near-zero variance: an item that crashes fails the job.
#
# Score regressions are caught by the full 50-item run, gated against the
# committed baseline. It runs on any PR that touches a file able to move a score —
# prompts, graph topology, model config, the eval itself — on a `run-eval` label,
# and on demand. Everything else stays cheap.
#
# Residual gap, acknowledged: a regression arriving through a path not listed
# below (a provider-side model change, a dependency bump) is not caught before
# merge. Run the full suite on demand after a dependency bump. A weekly schedule
# would close the gap, and is deliberately off until a baseline is committed —
# before that, every scheduled run could only fail.

name: eval

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One paid run per PR at a time: a new push supersedes the run in flight.
concurrency:
  group: eval-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  # Never used — replay is offline — but Settings requires them to be present.
  TAVILY_API_KEY: "unused-in-replay"
  DATABASE_URL: "postgresql://atlas:atlas@localhost:5432/atlas"
  REDIS_URL: "redis://localhost:6379/0"

jobs:
  changed-behaviour:
    # Did this PR touch anything that can move a score?
    name: behaviour surface
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.behaviour }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            behaviour:
              - 'backend/atlas/graph/**'
              - 'backend/atlas/models.py'
              - 'backend/atlas/config.py'
              - 'backend/atlas_eval/**'
              - '.env.example'

  smoke:
    # 12 items. Gates on crashes, never on score.
    name: eval smoke
    # Fork PRs have no secrets; failing them for that would be noise.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: run the smoke subset
        run: uv run python -m atlas_eval run --smoke --name smoke
      # always(): the run exits non-zero on any crashed item, and the run file is
      # what the crash is debugged from.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-smoke
          path: backend/atlas_eval/data/runs/smoke.json

  full:
    # The scored gate.
    name: eval full + gate
    needs: [changed-behaviour]
    # !cancelled(): changed-behaviour is skipped outside PRs, and a skipped
    # dependency would otherwise skip this job on dispatch too.
    if: >
      !cancelled() && (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name == github.repository &&
         (needs.changed-behaviour.outputs.changed == 'true' ||
          contains(github.event.pull_request.labels.*.name, 'run-eval')))
      )
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: run the full suite
        run: uv run python -m atlas_eval run --name current
      - name: gate against baseline
        run: uv run python -m atlas_eval gate --run current --baseline-run baseline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-full
          path: backend/atlas_eval/data/runs/current.json
