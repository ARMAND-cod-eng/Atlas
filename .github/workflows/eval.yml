# Atlas CI: static checks always, a cheap smoke on every PR, and the full scored
# suite when a change can actually move the scores.
#
# The gap this is shaped around, stated rather than left implicit: a 12-item smoke
# run CANNOT gate on completion or grounding. SE at n=12 is 11.55pp, so a 2pp
# threshold there would be pure noise. The smoke therefore gates only on signals
# with near-zero variance — exceptions, fixture integrity, schema validity, and
# tool-call validity, which is deterministic.
#
# That would leave grounding and completion regressions caught only after merge.
# So `changed-behaviour` detects edits to the files that can actually move those
# scores — prompts, graph topology, model config — and requires the full 50-item
# run on those PRs. Everything else stays cheap.
#
# Residual gap, acknowledged: a regression reaching the scores through a path not
# listed below (a provider-side model change, a dependency bump) is still caught
# post-merge by the scheduled/main run. Recovery is a revert on a failed main run.

name: eval

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    # No secrets, no network, no spend. Runs on forks.
    name: lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: sync
        working-directory: backend
        run: uv sync --frozen
      - name: ruff
        working-directory: backend
        run: uv run ruff check .
      - name: mypy --strict
        working-directory: backend
        run: uv run mypy --strict atlas atlas_eval
      - name: pytest
        working-directory: backend
        run: uv run pytest -q
      - name: dataset validates and the provenance claim is honest
        working-directory: backend
        run: uv run python -m atlas_eval claim

  changed-behaviour:
    # Did this PR touch anything that can move a score?
    name: behaviour surface
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.behaviour }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            behaviour:
              - 'backend/atlas/graph/nodes.py'
              - 'backend/atlas/graph/builder.py'
              - 'backend/atlas/graph/state.py'
              - 'backend/atlas/models.py'
              - 'backend/atlas/config.py'
              - 'backend/atlas_eval/**'
              - '.env.example'

  smoke:
    # 12 items. Gates on crashes and determinism, never on score.
    name: eval smoke
    runs-on: ubuntu-latest
    needs: static
    # Fork PRs have no secrets; failing them for that would be noise.
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - working-directory: backend
        run: uv sync --frozen
      - name: run the smoke subset
        working-directory: backend
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Never used — replay is offline — but Settings requires it to be present.
          TAVILY_API_KEY: "unused-in-replay"
          DATABASE_URL: "postgresql://atlas:atlas@localhost:5432/atlas"
          REDIS_URL: "redis://localhost:6379/0"
        run: uv run python -m atlas_eval run --smoke --name smoke
      # always(): the run now exits non-zero on any crashed item, and the run
      # file is what the crash is debugged from.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-smoke
          path: backend/atlas_eval/data/runs/smoke.json

  full:
    # The scored gate. Runs on main, on a `run-eval` label, or whenever the PR
    # touches a file that can move a score.
    name: eval full + gate
    runs-on: ubuntu-latest
    needs: [static, changed-behaviour]
    if: >
      github.event_name == 'push' ||
      needs.changed-behaviour.outputs.changed == 'true' ||
      contains(github.event.pull_request.labels.*.name, 'run-eval')
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - working-directory: backend
        run: uv sync --frozen
      - name: run the full suite
        working-directory: backend
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY: "unused-in-replay"
          DATABASE_URL: "postgresql://atlas:atlas@localhost:5432/atlas"
          REDIS_URL: "redis://localhost:6379/0"
        run: uv run python -m atlas_eval run --name current
      - name: gate against baseline
        working-directory: backend
        run: uv run python -m atlas_eval gate --run current --baseline-run baseline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-full
          path: backend/atlas_eval/data/runs/current.json
