# Local infrastructure for Atlas.
#
# Two ways to run Atlas:
#
#   docker compose up -d                  Postgres and Redis only. The API, worker
#                                         and frontend run on the host (fast
#                                         reloads, native debugging).
#   docker compose --profile app up --build
#                                         everything, in containers. Open
#                                         http://127.0.0.1:3000.
#
# Credentials here are local-development defaults and match .env.example. They are
# not secrets and are not intended to leave your machine.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: atlas-postgres
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas
    ports:
      - "5432:5432"
    volumes:
      # Named volume, not a bind mount: a bind-mounted PGDATA hits permission
      # failures on Windows hosts.
      - postgres_data:/var/lib/postgresql/data
      # Relative path with forward slashes — resolves correctly under Docker
      # Desktop's WSL 2 backend on Windows. Scripts here run once, on first
      # initialization of the volume above.
      - ./docker/init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: atlas-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- the application: `docker compose --profile app up --build` -------------
  #
  # Behind a profile so a plain `docker compose up` still starts only the two
  # services above, for running the API, worker and frontend on the host.

  api:
    profiles: [app]
    build: ./backend
    image: atlas-backend:local
    env_file: .env
    environment: &backend-network
      # Inside the compose network the services are reached by name; the .env
      # values point at localhost for running on the host, so they are replaced.
      DATABASE_URL: postgresql://atlas:atlas@postgres:5432/atlas
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on: &backend-deps
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    profiles: [app]
    # Same image as the API; only the command differs. Runs execute here.
    build: ./backend
    image: atlas-backend:local
    command: ["python", "-m", "atlas.worker_main"]
    env_file: .env
    environment: *backend-network
    depends_on: *backend-deps

  frontend:
    profiles: [app]
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
